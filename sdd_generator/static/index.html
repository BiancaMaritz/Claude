<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDD Generator</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1c2024;--mut:#5b6470;--line:#d9dde3;--acc:#1f5fbf;--acc-fg:#fff;--todo-bg:#fff3bf;--todo-fg:#6b4e00;--ok:#1b7f3b;--err:#c0392b;--sel:#e8f0fc}
@media (prefers-color-scheme:dark){:root{--bg:#121518;--panel:#1b1f23;--fg:#e8eaed;--mut:#9aa3ad;--line:#2d333a;--acc:#6ea8ff;--acc-fg:#0b1220;--todo-bg:#4a3d10;--todo-fg:#ffe08a;--ok:#5fd18a;--err:#ff8a80;--sel:#22314a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
main{overflow-y:auto;scroll-behavior:smooth}
h1.brand{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:12px;margin:2px 0 0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px}
.box h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
select,textarea,input[type=text],input[type=file]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px;align-items:center}
button{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.danger{color:var(--err)}
button:disabled{opacity:.5;cursor:default}
details.box>summary{cursor:pointer;margin-bottom:8px}
.modes{display:grid;gap:6px;margin:4px 0}
.modes label{display:flex;gap:8px;align-items:flex-start;color:var(--fg);font-size:13px;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.modes small{display:block;color:var(--mut)}
.modes input:checked+span{font-weight:600}
#msg{margin-top:8px;font-size:13px}#detail{font-size:12px;color:var(--mut)}#detail div{overflow-wrap:anywhere}textarea{resize:vertical}.ok{color:var(--ok)}.err{color:var(--err)}
nav ul{list-style:none;margin:0;padding:0}
nav .g{margin-top:10px;font-weight:600;font-size:13px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;color:var(--fg);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--sel)}nav a.on{background:var(--sel);font-weight:600}
nav .l2 a{padding-left:20px;font-size:13px}
.badge{align-self:flex-start;background:var(--todo-bg);color:var(--todo-fg);border-radius:10px;padding:0 7px;font-size:11px;white-space:nowrap}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .t{font-weight:600;font-size:15px;flex:1;min-width:160px}
.bar .s{color:var(--mut);font-size:12px}
.paper{max-width:980px;margin:20px auto 60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px 44px}
.paper h1.doc-title{font-size:26px;margin:0 0 6px}
.paper h2{font-size:21px;margin:34px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);scroll-margin-top:60px}
.paper h3{font-size:16px;margin:22px 0 6px;scroll-margin-top:60px}.paper h4{font-size:14px;margin:16px 0 4px;scroll-margin-top:60px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.todo{background:var(--todo-bg);color:var(--todo-fg);padding:0 3px;border-radius:3px}
.empty{max-width:560px;margin:90px auto;text-align:center;color:var(--mut)}
main details{max-width:980px;margin:0 auto 40px;padding:0 4px;color:var(--mut);font-size:13px}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}main{overflow:visible}.paper{padding:18px;margin:12px}.bar{padding:10px 16px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div><h1 class="brand">SDD Generator</h1><p class="sub">Automation Anywhere export to Solution Design Document</p><p class="sub">Version @@VERSION@@</p></div>

  <div class="box">
    <h2>Document</h2>
    <div class="row"><select id="docSel" aria-label="Document"></select><button id="newBtn" title="Create a new document">New</button></div>
    <div id="newRow" class="row" hidden style="margin-top:8px"><input id="newName" type="text" placeholder="Document name" maxlength="60"><button id="newOk">OK</button></div>
  </div>

  <details class="box" id="loadBox" open>
    <summary><h2 style="display:inline">Load files</h2></summary>
    <div class="modes" role="radiogroup" aria-label="Load mode">
      <label><input type="radio" name="mode" value="add" checked><span>Add to document<small>Merge bots into what is already there. Same bot path: the new one replaces it.</small></span></label>
      <label><input type="radio" name="mode" value="overwrite"><span>Overwrite document<small>Start the document again from these files only.</small></span></label>
    </div>
    <label for="files">Export .zip file(s) and optional intake .json (any size)</label>
    <input id="files" type="file" multiple accept=".zip,.json">
    <label for="paths">Or load from a path on this computer (.zip, export folder or .json). Fastest for large exports.</label>
    <textarea id="paths" rows="2" placeholder="C:\Exports\Herotel.zip"></textarea>
    <label for="title">Title (optional)</label>
    <input id="title" type="text" placeholder="Document title" maxlength="120">
    <div class="row" style="margin-top:10px"><button id="loadBtn" class="primary">Load</button></div>
    <div id="msg" role="status"></div><div id="detail"></div>
  </details>

  <nav aria-label="Sections"><div class="box"><h2>Sections</h2><ul id="menu"></ul></div></nav>
</aside>

<main id="main">
  <div class="bar" id="bar" hidden>
    <span class="t" id="docTitle"></span><span class="s" id="docStat"></span>
    <button id="dlDocx" class="primary">Word (.docx)</button><button id="dlMd">Markdown (.md)</button><button id="delBtn" class="danger">Delete</button>
  </div>
  <div id="view"><div class="empty"><h2>No document yet</h2><p>Create a document, then load an export .zip. The expected SDD appears here and the sections appear on the left.</p></div></div>
</main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let current = null;

function say(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }
function remember(v) { try { localStorage.setItem("sdd.doc", v); } catch (e) {} }
function recall() { try { return localStorage.getItem("sdd.doc"); } catch (e) { return null; } }

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}

async function refreshDocs(select) {
  const docs = await api("/api/docs");
  const sel = $("docSel");
  sel.replaceChildren();
  for (const d of docs) {
    const o = document.createElement("option");
    o.value = d.name; o.textContent = `${d.name} (${d.bots} bots)`;
    sel.appendChild(o);
  }
  const want = select || recall();
  if (docs.some(d => d.name === want)) sel.value = want;
  current = docs.length ? sel.value : null;
  await showDoc();
}

async function showDoc() {
  const view = $("view"), menu = $("menu");
  menu.replaceChildren();
  if (!current) { $("bar").hidden = true; return; }
  remember(current);
  const d = await api("/api/doc?name=" + encodeURIComponent(current));
  $("loadBox").open = !d.html;
  $("bar").hidden = false;
  $("docTitle").textContent = d.title;
  $("docStat").textContent = `${d.bots} bots, updated ${d.updated.replace("T", " ")}`;
  if (!d.html) {
    view.innerHTML = '<div class="empty"><h2>Empty document</h2><p>Load an export .zip to generate the SDD.</p></div>';
    return;
  }
  view.innerHTML = '<article class="paper">' + d.html + '</article>';
  const hist = document.createElement("details");
  const sm = document.createElement("summary"); sm.textContent = "Load history";
  hist.appendChild(sm);
  for (const h of d.history) {
    const p = document.createElement("div");
    p.textContent = `${h.at.replace("T", " ")}  ${h.mode}: ${h.files.join(", ")}  (+${h.added} added, ${h.updated} updated, ${h.unchanged} unchanged, ${h.removed} removed)`;
    hist.appendChild(p);
  }
  view.appendChild(hist);
  let group = null;
  for (const m of d.menu) {
    const li = document.createElement("li");
    if (m.level === 1) { li.className = "g"; group = li; } else { li.className = "l2"; }
    const a = document.createElement("a");
    a.dataset.target = m.id;
    const t = document.createElement("span"); t.textContent = m.text; a.appendChild(t);
    if (m.todo) { const b = document.createElement("span"); b.className = "badge"; b.textContent = m.todo + " to do"; b.title = "Placeholders still open in this section"; a.appendChild(b); }
    a.addEventListener("click", () => { $(m.id).scrollIntoView({behavior: "smooth", block: "start"}); });
    li.appendChild(a); menu.appendChild(li);
  }
  spy();
}

function spy() {
  const links = [...document.querySelectorAll("#menu a")];
  const main = $("main");
  const on = () => {
    let active = null;
    for (const a of links) { const el = $(a.dataset.target); if (el && el.getBoundingClientRect().top < 140) active = a; }
    links.forEach(a => a.classList.toggle("on", a === active));
  };
  main.onscroll = on; window.onscroll = on; on();
}

$("docSel").addEventListener("change", async e => { current = e.target.value; await showDoc(); });
$("newBtn").addEventListener("click", () => { $("newRow").hidden = false; $("newName").focus(); });
$("newOk").addEventListener("click", async () => {
  const n = $("newName").value.trim();
  if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,59}$/.test(n)) { say("Name: 1 to 60 letters, digits, spaces, dot, dash or underscore.", "err"); return; }
  const o = document.createElement("option"); o.value = n; o.textContent = n + " (new)";
  $("docSel").appendChild(o); $("docSel").value = n; current = n;
  $("newRow").hidden = true; $("newName").value = "";
  $("view").innerHTML = '<div class="empty"><h2>New document: ' + n.replace(/[<>&]/g, "") + '</h2><p>Load an export .zip to generate the SDD.</p></div>';
  $("bar").hidden = true; $("menu").replaceChildren(); say("");
});

function stage(file, label) {
  // Streams the file to the local server in chunks; works for multi-gigabyte exports.
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/stage?name=" + encodeURIComponent(file.name));
    x.upload.onprogress = e => { if (e.lengthComputable) say(`${label}: uploading ${file.name} ${Math.round(100 * e.loaded / e.total)}% of ${(file.size / 1048576).toFixed(0)} MB`); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status === 200 ? resolve(j) : reject(new Error(j.error || "Upload failed (" + x.status + ")")); };
    x.onerror = () => reject(new Error("The upload failed. Check that run.bat is still running. If the file is in OneDrive, make sure it is stored on this device (right-click, Always keep on this device), or paste its path under Load from a path."));
    x.send(file);
  });
}

$("loadBtn").addEventListener("click", async () => {
  const files = [...$("files").files], paths = $("paths").value.trim();
  if (!current) { say("Create a document first.", "err"); return; }
  if (!files.length && !paths) { say("Choose a file or enter a path.", "err"); return; }
  const bad = files.find(f => !/\.(zip|json)$/i.test(f.name));
  if (bad) { say(bad.name + ": only .zip exports and .json intake files are supported.", "err"); return; }
  const mode = document.querySelector('input[name=mode]:checked').value;
  if (mode === "overwrite" && !confirm(`Overwrite "${current}"? Its stored bots and intake will be replaced by these files.`)) return;
  $("loadBtn").disabled = true; say("Loading..."); $("detail").replaceChildren();
  try {
    const staged = [];
    for (const [i, f] of files.entries()) staged.push((await stage(f, `File ${i + 1} of ${files.length}`)).token);
    say("Reading the export...");
    const body = JSON.stringify({doc: current, mode, title: $("title").value.trim(), paths, staged});
    const j = await api("/api/load", {method: "POST", body, headers: {"Content-Type": "application/json"}});
    const r = j.report;
    const seen = r.already_loaded.length ? ` Already loaded before: ${r.already_loaded.join(", ")}.` : "";
    if (r.noop) say(`No changes: this content is already in "${j.name}" (${r.unchanged} bots identical).` + seen, "ok");
    else say(`${r.mode === "add" ? "Added to" : "Overwrote"} "${j.name}": ${r.added} added, ${r.updated} updated, ${r.unchanged} unchanged, ${r.removed} removed` + (r.intake ? `, ${r.intake} intake file(s)` : "") + "." + seen, "ok");
    for (const k of ["added", "updated", "removed"]) {
      if (r.names && r.names[k].length) {
        const d = document.createElement("div");
        d.textContent = k + ": " + r.names[k].map(x => x.split("/").pop()).join(", ");
        $("detail").appendChild(d);
      }
    }
    $("files").value = ""; $("paths").value = ""; $("title").value = "";
    await refreshDocs(j.name);
  } catch (e) { say(e.message === "Failed to fetch" ? "Cannot reach the app. Check that run.bat is still running." : e.message, "err"); }
  finally { $("loadBtn").disabled = false; }
});

$("dlDocx").addEventListener("click", () => { if (current) location.href = `/download/${encodeURIComponent(current)}/docx`; });
$("dlMd").addEventListener("click", () => { if (current) location.href = `/download/${encodeURIComponent(current)}/md`; });
$("delBtn").addEventListener("click", async () => {
  if (!current || !confirm(`Delete "${current}" permanently?`)) return;
  await api("/api/delete", {method: "POST", body: JSON.stringify({name: current})});
  current = null; await refreshDocs();
});

refreshDocs().catch(e => say(e.message, "err"));
</script>
</body>
</html>
