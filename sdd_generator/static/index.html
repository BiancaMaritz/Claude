<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDD Generator</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1c2024;--mut:#5b6470;--line:#d9dde3;--acc:#1f5fbf;--acc-fg:#fff;--todo-bg:#fff3bf;--todo-fg:#6b4e00;--doc-bg:#dbe8fb;--doc-fg:#173f7a;--ok:#1b7f3b;--err:#c0392b;--sel:#e8f0fc}
@media (prefers-color-scheme:dark){:root{--bg:#121518;--panel:#1b1f23;--fg:#e8eaed;--mut:#9aa3ad;--line:#2d333a;--acc:#6ea8ff;--acc-fg:#0b1220;--todo-bg:#4a3d10;--todo-fg:#ffe08a;--doc-bg:#1f3558;--doc-fg:#a9c8ff;--ok:#5fd18a;--err:#ff8a80;--sel:#22314a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
main{overflow-y:auto;scroll-behavior:smooth}
h1.brand{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:12px;margin:2px 0 0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px}
.box>h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px;font-weight:600}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
select,textarea,input[type=text],input[type=file]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
button{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.danger{color:var(--err)}
button.tiny{padding:1px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:8px;font-size:13px}.ok{color:var(--ok)}.err{color:var(--err)}
.detail{font-size:12px;color:var(--mut)}.detail div{overflow-wrap:anywhere}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.files{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
.files li{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line)}
.files span{overflow-wrap:anywhere}.files small{color:var(--mut);display:block}

/* left menu */
#menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#menu>li>a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;cursor:pointer;font-weight:600}
#menu>li>a:hover{background:var(--sel)}#menu>li>a.on{background:var(--sel);color:var(--acc)}
#menu .count{font-weight:400;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--mut)}
#menu ul{list-style:none;margin:2px 0 6px;padding:0 0 0 8px}
#menu ul a{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;color:var(--fg);text-decoration:none;cursor:pointer;font-size:13px;font-weight:400}
#menu ul a:hover{background:var(--sel)}#menu ul a.on{background:var(--sel);font-weight:600}
#menu ul .g>a{font-weight:600;margin-top:6px}
#menu .tags{display:flex;gap:4px;align-self:flex-start;flex-wrap:wrap;justify-content:flex-end}
.badge{background:var(--todo-bg);color:var(--todo-fg);border-radius:10px;padding:0 7px;font-size:11px;white-space:nowrap;font-weight:400}
.badge.doc{background:var(--doc-bg);color:var(--doc-fg)}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.red{background:#fde2e0;color:#8c1d14}.pill.amber{background:var(--todo-bg);color:var(--todo-fg)}.pill.green{background:#d9f2e1;color:#14582b}.pill.grey{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.pill.red{background:#5a1f1a;color:#ffb3ab}.pill.green{background:#16432a;color:#9be3b4}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--mut);font-size:12px}
.method{font-size:13px;color:var(--mut);margin:0 0 16px}.method summary{cursor:pointer}
td ul{margin:0;padding-left:16px}

/* right side */
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .t{font-weight:600;font-size:15px;flex:1;min-width:160px}
.bar .s{color:var(--mut);font-size:12px}
.page{max-width:980px;margin:0 auto;padding:20px 24px 60px}
.page h1{font-size:22px;margin:0 0 4px}
.page .lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 16px}
.card>h2{font-size:15px;margin:0 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.modes label{display:flex;gap:8px;align-items:flex-start;color:var(--fg);font-size:13px;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.modes small{display:block;color:var(--mut)}
.modes input:checked+span{font-weight:600}
.paper{max-width:980px;margin:20px auto 60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px 44px}
.paper h1.doc-title{font-size:26px;margin:0 0 6px}
.paper h2{font-size:21px;margin:34px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);scroll-margin-top:60px}
.paper h3{font-size:16px;margin:22px 0 6px;scroll-margin-top:60px}.paper h4{font-size:14px;margin:16px 0 4px;scroll-margin-top:60px}
.paper figure{margin:12px 0}.paper figure img{max-width:100%;border:1px solid var(--line);border-radius:4px}.paper figcaption{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.todo{background:var(--todo-bg);color:var(--todo-fg);padding:0 3px;border-radius:3px}
.src{display:inline-block;margin:10px 0 2px;padding:1px 8px;border-radius:10px;background:var(--doc-bg);color:var(--doc-fg);font-size:12px;font-style:italic}
.empty{max-width:560px;margin:90px auto;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.item video,.item img{width:100%;border-radius:4px;background:#000;display:block;max-height:220px;object-fit:contain}
.item h3{font-size:13px;margin:8px 0 2px;overflow-wrap:anywhere}
.item .row{margin-top:6px;flex-wrap:wrap}
details.hist{max-width:980px;margin:0 auto 40px;padding:0 4px;color:var(--mut);font-size:13px}
@media (max-width:860px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}main{overflow:visible}.paper{padding:18px;margin:12px}.bar{padding:10px 16px}.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div><h1 class="brand">SDD Generator</h1><p class="sub">Automation Anywhere export to Solution Design Document</p><p class="sub">Version @@VERSION@@</p></div>

  <div class="box">
    <h2>Select Project</h2>
    <div class="row"><select id="projSel" aria-label="Project"></select><button id="newBtn" title="Create a new project">New</button></div>
    <div id="newRow" class="row" hidden style="margin-top:8px"><input id="newName" type="text" placeholder="Project name" maxlength="60"><button id="newOk">OK</button></div>
    <p class="note" id="dataDir"></p>
    <div id="recover" hidden>
      <p class="note"><b>Stored projects were found in other folders.</b> They are not in the folder this app uses now.</p>
      <ul class="files" id="recoverList"></ul>
    </div>
    <details class="note"><summary>Recover projects from a folder</summary>
      <input id="rpath" type="text" placeholder="C:\Dev\sdd-generator\sdd-generator\data\documents">
      <div class="row" style="margin-top:6px"><button id="rbtn" class="tiny">Recover</button></div>
      <div class="msg" id="rmsg" role="status"></div>
    </details>
  </div>

  <nav aria-label="Project" id="nav" hidden><div class="box"><h2 id="navTitle">Project</h2><ul id="menu"></ul></div></nav>
</aside>

<main id="main"><div id="view"></div></main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = t => (t || "").replace("T", " ");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const post = (url, obj) => api(url, {method: "POST", body: JSON.stringify(obj), headers: {"Content-Type": "application/json"}});

const VIEWS = [
  {id: "sdd", label: "SDD"}, {id: "analysis", label: "Analysis"}, {id: "code", label: "Code"}, {id: "docs", label: "Documentation"},
  {id: "videos", label: "Videos"}, {id: "graphs", label: "Graphs"}, {id: "tables", label: "Tables"}];
const S = {project: null, view: "sdd", info: null, sdd: null, flash: null};

// ------------------------------------------------------------- uploads ---
function stage(file, label, setMsg) {
  // Streams the file to the local server in chunks; works for multi-gigabyte files.
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/stage?name=" + encodeURIComponent(file.name));
    x.upload.onprogress = e => { if (e.lengthComputable) setMsg(`${label}: uploading ${file.name} ${Math.round(100 * e.loaded / e.total)}% of ${(file.size / 1048576).toFixed(0)} MB`); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status === 200 ? resolve(j) : reject(new Error(j.error || "Upload failed (" + x.status + ")")); };
    x.onerror = () => reject(new Error("The upload failed. Check that run.bat is still running. If the file is in OneDrive, make sure it is stored on this device (right-click, Always keep on this device), or paste its path instead."));
    x.send(file);
  });
}

const n = v => Array.isArray(v) ? v.length : v;
const base = x => x.split("/").pop();
const list = (a, max = 12) => a.length > max ? a.slice(0, max).join(", ") + ` and ${a.length - max} more` : a.join(", ");
const flash = (text, lines) => { S.flash = {view: S.view, text, lines: lines || []}; };
async function refreshProjects() {
  // keep the picker's counts current, and a project that has now been saved stops saying "new"
  const docs = await api("/api/docs"), sel = $("projSel");
  sel.replaceChildren();
  for (const d of docs) sel.append(h("option", {value: d.name}, `${d.name} (${d.bots} bots)`));
  if (S.project && !docs.some(d => d.name === S.project)) sel.append(h("option", {value: S.project}, S.project + " (new)"));
  if (S.project) sel.value = S.project;
}
async function reload() { S.sdd = null; await loadInfo(); await refreshProjects(); await show(); }

// A reusable "load files" form. send(staged, paths, mode) posts the request; onDone(res) returns
// {text, lines}, shown after the view refreshes.
function loadForm({accept, allowed, pathHint, modes, send, button, onDone, extra}) {
  const msg = h("div", {class: "msg", role: "status"}), detail = h("div", {class: "detail"});
  const files = h("input", {type: "file", multiple: true, accept}), paths = h("textarea", {rows: 2, placeholder: pathHint});
  const group = "m" + Math.random().toString(36).slice(2);
  const radios = modes ? h("div", {class: "modes", role: "radiogroup"}, modes.map((m, i) =>
    h("label", {}, h("input", {type: "radio", name: group, value: m.value, checked: i === 0}), h("span", {}, m.title, h("small", {}, m.help))))) : null;
  const btn = h("button", {class: "primary"}, button);
  const say = (t, c) => { msg.textContent = t; msg.className = "msg " + (c || ""); };
  if (S.flash && S.flash.view === S.view) {
    say(S.flash.text, "ok"); for (const l of S.flash.lines) detail.append(h("div", {}, l)); S.flash = null;
  }
  btn.addEventListener("click", async () => {
    const chosen = [...files.files], p = paths.value.trim();
    if (!chosen.length && !p) { say("Choose a file or enter a path.", "err"); return; }
    const bad = chosen.find(f => !allowed.test(f.name));
    if (bad) { say(bad.name + ": not a supported file type here.", "err"); return; }
    const mode = radios ? radios.querySelector("input:checked").value : "add";
    if (mode === "overwrite" && !confirm("Replace everything stored here with these files?")) return;
    btn.disabled = true; say("Loading..."); detail.replaceChildren();
    try {
      const staged = [];
      for (const [i, f] of chosen.entries()) staged.push((await stage(f, `File ${i + 1} of ${chosen.length}`, say)).token);
      say("Reading...");
      const out = onDone(await send(staged, p, mode));
      flash(out.text, out.lines);
      await reload();
    } catch (e) { say(e.message === "Failed to fetch" ? "Cannot reach the app. Check that run.bat is still running." : e.message, "err"); btn.disabled = false; }
  });
  return h("div", {}, radios, h("label", {}, "Files"), files,
    h("label", {}, "Or a path on this computer. Fastest for large files."), paths,
    extra, h("div", {class: "row", style: "margin-top:10px"}, btn), msg, detail);
}
const changed = obj => Object.entries(obj).filter(([, v]) => v && v.length).map(([k, v]) => `${k}: ${list(v.map(base))}`);

function sectionSelect(info, value, onChange) {
  const s = h("select", {}, info.sections.map(x => h("option", {value: x.key, selected: x.key === value}, x.label)));
  s.addEventListener("change", () => onChange(s.value));
  return s;
}
const header = (title, lead) => [h("h1", {}, title), h("p", {class: "lead"}, lead)];

// ---------------------------------------------------------------- views ---
function viewCode() {
  const i = S.info, p = S.project, c = i.code;
  const title = h("input", {type: "text", placeholder: "Project title (optional)", maxlength: 120});
  const form = loadForm({
    accept: ".zip", allowed: /\.zip$/i, pathHint: "C:\\Exports\\Lucy.zip (a .zip or an extracted export folder)", button: "Load code",
    modes: [{value: "add", title: "Update: only what changed", help: "Bots in the files replace the same bots stored; everything else stays. Use this when one part of the code changed."},
            {value: "overwrite", title: "Replace everything", help: "Fresh reload: the stored code becomes exactly these files. Documentation, videos, graphs and tables are kept."}],
    send: (staged, paths, mode) => post("/api/load", {doc: p, mode, paths, staged, title: title.value.trim()}),
    onDone: res => {
      const r = res.report;
      return {text: r.noop ? "No changes: this code is already stored." : `${r.mode === "add" ? "Updated" : "Replaced"}: ${r.added} added, ${r.updated} updated, ${r.unchanged} unchanged, ${r.removed} removed.`,
        lines: [...changed(r.names || {}), ...(r.already_loaded && r.already_loaded.length ? ["already loaded before: " + r.already_loaded.join(", ")] : [])]};
    },
    extra: h("div", {}, h("label", {}, "Project title (optional)"), title)});
  return [...header("Code", "What is built. The code has the highest priority: documentation, videos, graphs and tables only fill gaps."),
    h("div", {class: "card"}, h("h2", {}, "Load code"), form),
    h("div", {class: "card"}, h("h2", {}, `Current code: ${c.bots} bots`),
      c.sources.length ? h("ul", {class: "files"}, c.sources.map(s => h("li", {}, h("span", {}, s.name, h("small", {}, s.at ? "loaded " + fmt(s.at) : ""))))) : h("p", {class: "note"}, "No code loaded yet."),
      c.folders.length ? h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Folder"), h("th", {}, "Bots"))),
        h("tbody", {}, c.folders.map(f => h("tr", {}, h("td", {}, f.folder), h("td", {}, f.bots)))))) : null),
    c.assets && c.assets.length ? h("div", {class: "card"}, h("h2", {}, `Other files in the export: ${c.assets.length}`),
      h("p", {class: "note"}, "Forms, processes and other files that are not task bots. They are listed in the SDD, but their contents are not analysed yet."),
      h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, ["Name", "Type", "Folder"].map(x => h("th", {}, x)))),
        h("tbody", {}, c.assets.map(a => h("tr", {}, h("td", {}, a.name), h("td", {}, a.kind), h("td", {}, a.folder || "-"))))))) : null];
}

function viewDocs() {
  const i = S.info, p = S.project;
  const form = loadForm({
    accept: ".pdf,.docx,.md,.txt,.json", allowed: /\.(pdf|docx|md|txt|json)$/i, pathHint: "C:\\Dev\\Documents\\Lucy (a file or a folder of documents)", button: "Load documentation",
    modes: [{value: "add", title: "Add documentation", help: "Keep what is stored. The same file again changes nothing; a file with the same name replaces the older copy."},
            {value: "overwrite", title: "Replace all documentation", help: "Stored documentation and intake become exactly these files. Code is never touched."}],
    send: (staged, paths, mode) => post("/api/documentation/load", {doc: p, mode, paths, staged}),
    onDone: res => {
      const r = res.report;
      return {text: r.noop ? "No changes: this content is already stored." : `${r.mode === "add" ? "Added" : "Replaced"}: ${n(r.added)} added, ${n(r.updated)} updated, ${n(r.unchanged)} unchanged, ${n(r.removed)} removed.`,
        lines: changed({added: r.added, updated: r.updated, removed: r.removed})};
    }});
  return [...header("Documentation", "Old SDDs or other documents about the process (.pdf, .docx, .md; an intake .json too). The code always wins: documentation only fills what would otherwise be to do, and every passage is marked with its source."),
    h("div", {class: "card"}, h("h2", {}, "Load documentation"), form, h("p", {class: "note"}, "Text and tables are read. Screenshots and diagrams are not imported; add those under Graphs.")),
    h("div", {class: "card"}, h("h2", {}, `Stored documentation: ${i.documentation.length}`),
      i.documentation.length ? h("ul", {class: "files"}, i.documentation.map(f => h("li", {},
        h("span", {}, f.name, h("small", {}, `${f.pages ? f.pages + " pages, " : ""}${f.sections.length} sections: ${f.sections.join(", ")}`)),
        h("button", {class: "tiny danger", onclick: async () => { if (confirm(`Remove "${f.name}"?`)) { await post("/api/documentation/remove", {doc: p, fp: f.fp}); reload(); } }}, "Remove")))) : h("p", {class: "note"}, "None yet."))];
}

function viewVideos() {
  const i = S.info, p = S.project;
  let section = "appendix";
  const form = loadForm({
    accept: ".mp4,.m4v,.mov,.mkv,.webm,.avi", allowed: /\.(mp4|m4v|mov|mkv|webm|avi)$/i, pathHint: "C:\\Videos\\Walkthrough.mp4 (stays where it is; nothing is copied)", button: "Add videos",
    send: (staged, paths) => post("/api/video/add", {doc: p, staged, paths, section}),
    onDone: res => ({text: `Added: ${res.added.join(", ")}`}),
    extra: h("div", {}, h("label", {}, "Place the transcript in this SDD section"), sectionSelect(i, section, v => { section = v; }))});
  const card = v => {
    const tf = h("input", {type: "file", accept: ".srt,.vtt,.txt,.md,.docx", style: "display:none"});
    tf.addEventListener("change", async () => {
      if (!tf.files.length) return;
      try { const t = await stage(tf.files[0], "Transcript", () => {}); await post("/api/video/transcript", {doc: p, id: v.id, staged: [t.token]}); flash(`Transcript attached to ${v.name}.`); reload(); }
      catch (e) { alert(e.message); }
    });
    return h("div", {class: "item"},
      v.has_file ? h("video", {controls: true, preload: "metadata", src: v.url}) : h("p", {class: "err"}, "The file is no longer at its stored location."),
      h("h3", {}, v.name), h("div", {class: "note"}, `${(v.size / 1048576).toFixed(1)} MB, ${v.kind === "path" ? "linked, not copied" : "stored by the app"}`),
      h("label", {}, "SDD section"), sectionSelect(i, v.section, async s => { await post("/api/item/update", {doc: p, kind: "videos", id: v.id, section: s}); }),
      h("div", {class: "note"}, v.transcript ? `Transcript: ${v.transcript.name} (${v.transcript.chars.toLocaleString()} characters)` : "No transcript: this video adds nothing to the SDD yet."),
      h("div", {class: "row"}, tf, h("button", {class: "tiny", onclick: () => tf.click()}, v.transcript ? "Replace transcript" : "Attach transcript"),
        v.transcript ? h("button", {class: "tiny", onclick: async () => { await post("/api/item/update", {doc: p, kind: "videos", id: v.id, transcript: null}); reload(); }}, "Remove transcript") : null,
        h("button", {class: "tiny danger", onclick: async () => { if (confirm(`Remove "${v.name}" from this project?`)) { await post("/api/item/remove", {doc: p, kind: "videos", id: v.id}); reload(); } }}, "Remove video")));
  };
  return [...header("Videos", "Old walkthroughs and recordings. Attach a transcript (.srt, .vtt, .txt, .md or .docx) and its text is placed in the SDD section you choose, marked as not verified against the code."),
    h("div", {class: "card"}, h("h2", {}, "Add videos"), form, h("p", {class: "note"}, "The app plays the video but does not read its audio. A transcript is what adds content.")),

function tableReport(r) {
  const lines = [];
  for (const [t, d] of Object.entries(r.changes || {})) {
    const bits = [d.added.length ? "columns added: " + d.added.join(", ") : "", d.removed.length ? "columns removed: " + d.removed.join(", ") : "",
      d.retyped.length ? "retyped: " + d.retyped.join(", ") : "", `rows ${d.rows[0].toLocaleString()} to ${d.rows[1].toLocaleString()}`].filter(Boolean);
    lines.push(`${t}: ${bits.join("; ")}`);
  }
  if (r.removed.length) lines.push("removed: " + r.removed.join(", "));
  return {text: r.noop ? "No changes: these tables are already stored." : `${r.mode === "add" ? "Updated" : "Replaced all"}: ${r.added.length} added, ${r.replaced.length} replaced, ${r.unchanged.length} unchanged, ${r.removed.length} removed.`, lines};
}

function viewTables() {

    h("div", {class: "card"}, h("h2", {}, `Tables: ${i.tables.length}`),
      i.tables.length ? h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, ["Table", "Rows", "Columns", "Loaded", ""].map(x => h("th", {}, x)))), h("tbody", {}, i.tables.map(row)))) : h("p", {class: "note"}, "None yet."))];

const PILL = {Certain: "red", Likely: "amber", Possible: "grey", Covered: "green", Partly: "amber", "Not found": "red", "Not checkable": "grey",
  Open: "red", Changed: "amber", Accepted: "green"};
const pill = (t, label) => h("span", {class: "pill " + (PILL[t] || "grey")}, label || t);

function findingCard(f, p) {
  const r = f.rule, accepted = f.status === "Accepted";
  const act = accepted
    ? h("button", {class: "tiny", onclick: async () => { await post("/api/rules/reopen", {doc: p, id: f.id}); reload(); }}, "Reopen")
    : h("button", {class: "tiny primary", onclick: async () => {
        const note = prompt("Why is this change valid? (optional note, kept with the acceptance)", "");
        if (note === null) return;
        await post("/api/rules/accept", {doc: p, id: f.id, note}); flash("Accepted. It now sits under Accepted.", []); reload();
      }}, "Accept: the change is valid");
  return h("div", {class: "item", style: "margin:0 0 10px"},
    h("div", {class: "row", style: "justify-content:space-between"}, h("span", {}, pill(f.status, f.status === "Changed" ? "Reopened: a value changed" : f.status), " ", h("b", {}, r.id), " ",
      h("span", {class: "note"}, `${r.doc}${r.page ? ", page " + r.page : ""}`)), act),
    h("p", {class: "note", style: "margin:6px 0"}, `"${r.text.length > 260 ? r.text.slice(0, 260) + "..." : r.text}"`),
    h("div", {class: "grid", style: "grid-template-columns:1fr 1fr"},
      h("div", {}, h("div", {class: "note"}, "Documentation says"), h("b", {}, f.doc_says)),
      h("div", {}, h("div", {class: "note"}, "Code does, in " + f.where), h("b", {}, f.code_says))),
    f.detail.length && f.kind === "codes" ? h("ul", {class: "note"}, f.detail.map(d => h("li", {}, d))) : null,
    accepted || f.note ? h("div", {class: "note"}, `${accepted ? "Accepted" : "Previously accepted"}${f.accepted_at ? " on " + f.accepted_at.slice(0, 10) : ""}${f.note ? ": " + f.note : ""}`) : null);
}

async function viewAnalysis() {
  const p = S.project;
  let g;
  try { g = await api("/api/analysis?name=" + encodeURIComponent(p)); } catch (e) { return [h("div", {class: "page"}, ...header("Analysis", "Nothing to analyse yet."), h("p", {class: "note"}, "Load the code first."))]; }
  const m = g.summary, rs = g.rules.summary, strong = g.rules.findings.filter(f => f.link === "strong"), weakOnes = g.rules.findings.filter(f => f.link !== "strong");
  const stat = (big, small) => h("div", {class: "stat"}, h("b", {}, big), h("span", {}, small));
  const stats = h("div", {class: "stats"},
    stat(m.to_provide, "bots to provide (the code calls them, they are not in the export)"),
    stat(rs.open + rs.changed, `rule differences to decide (${rs.accepted} accepted)`),
    stat(rs.checked ? `${rs.agree} of ${rs.checked}` : "-", "checked documentation facts that agree with the code"),
    stat(m.doc_only_bots + m.steps_total + m.doc_only_tables, "found only outside the code, assumed retired"));
  const flashLine = S.flash && S.flash.view === "analysis" ? (() => { const t = S.flash.text; S.flash = null; return h("p", {class: "msg ok"}, t); })() : null;

  // rule differences
  const filter = h("select", {style: "width:auto"}, ["Open", "Accepted", "All"].map(x => h("option", {value: x}, x === "Open" ? "To decide" : x)));
  const box = h("div", {});
  const draw = () => {
    box.replaceChildren();
    const want = filter.value, show = f => want === "All" || (want === "Open" ? f.status !== "Accepted" : f.status === "Accepted");
    const list = strong.filter(show);
    if (!list.length) box.append(h("p", {class: "note"}, rs.checked || weakOnes.length ? (want === "Open" ? "No differences left to decide." : "Nothing here.") : (m.has_docs ? "No documented rule could be tied to a place in the code, so nothing could be compared." : "Load documentation to compare its rules with the code.")));
    for (const f of list) box.append(findingCard(f, p));
    const weakShown = weakOnes.filter(show);
    if (weakShown.length) box.append(h("details", {class: "method"}, h("summary", {}, `Weaker links (${weakShown.length}): the rule and the step share only one word, so these may be unrelated`),
      weakShown.map(f => findingCard(f, p))));
  };
  filter.addEventListener("change", draw); draw();

  const agree = g.rules.agreements.length ? h("details", {class: "method"}, h("summary", {}, `Checked and agree (${g.rules.agreements.length})`),
    h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, ["Rule", "Documentation", "Code", "Where"].map(x => h("th", {}, x)))),
      h("tbody", {}, g.rules.agreements.map(a => h("tr", {}, h("td", {}, `${a.rule.id} (${a.rule.doc})`), h("td", {}, a.doc_says), h("td", {}, a.code_says), h("td", {}, a.where))))))) : null;

  const botRows = g.bots.map(e => h("tr", {}, h("td", {}, h("b", {}, e.name)), h("td", {}, h("ul", {}, e.reasons.map(r => h("li", {}, r)))), h("td", {}, e.where.join("; ") || "-")));
  const d = g.doc_only;
  const docOnly = (d.bots.length || d.tables.length || d.steps.length) ? h("details", {class: "method"}, h("summary", {}, `Found only outside the code (${d.bots.length + d.tables.length + d.steps.length}): assumed retired, no action needed`),
    d.bots.length ? [h("p", {}, "Bots the documentation lists that no bot in the code matches:"), h("ul", {}, d.bots.map(e => h("li", {}, `${e.name} (${e.where.join("; ")})`)))] : null,
    d.tables.length ? [h("p", {}, "Exported tables that no SQL in the code touches:"), h("ul", {}, d.tables.map(e => h("li", {}, e.name.replace("A bot that uses table ", ""))))] : null,
    d.steps.length ? [h("p", {}, `Documented process steps (${d.steps.length}), compared with the code by shared words:`),
      h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, ["Step", "Documented", "Status", "Closest code"].map(x => h("th", {}, x)))),
        h("tbody", {}, d.steps.map(s => h("tr", {}, h("td", {}, `${s.step} (${s.doc.slice(0, 30)})`), h("td", {}, s.text.length > 160 ? s.text.slice(0, 160) + "..." : s.text), h("td", {}, pill(s.status)), h("td", {}, s.best ? `${s.best}: ${s.matched.join(", ")}` : "-"))))))] : null) : null;

  return [h("div", {class: "page"}, ...header("Analysis", "The code is the source of truth. This tab shows what the code needs that is missing, and where the documentation says something different from what the code does. Anything found only outside the code is assumed retired."),
    ...g.notes.map(x => h("p", {class: "note", style: "color:var(--todo-fg);background:var(--todo-bg);padding:6px 10px;border-radius:6px"}, x)),
    flashLine, stats,
    h("div", {class: "card"}, h("div", {class: "row", style: "justify-content:space-between"}, h("h2", {style: "margin:0"}, "Rule differences"), filter),
      h("p", {class: "note"}, "Documented rules that read differently from the code: time limits, retry counts, lists of codes, file naming patterns. Accept a difference when the change is valid; the code stays the truth and the SDD records your note. If the documentation or the code changes afterwards, the difference reopens by itself."),
      box, agree),
    h("div", {class: "card"}, h("div", {class: "row", style: "justify-content:space-between"}, h("h2", {style: "margin:0"}, "Bots to provide"),
        g.bots.length ? h("button", {class: "tiny", onclick: () => { location.href = `/download/${encodeURIComponent(p)}/analysis`; }}, "Download list (.csv)") : null),
      g.bots.length ? h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, ["Bot", "Why", "Where to find it"].map(x => h("th", {}, x)))), h("tbody", {}, botRows)))
        : h("p", {class: "note"}, m.has_code ? "None. Every bot the code calls is in the export, and the manifest lists no bot without its file." : "Load code first.")),
    docOnly,
    h("details", {class: "method"}, h("summary", {}, "How this is worked out"),
      h("p", {}, "Bots to provide: a bot in the code calls another bot that is not in the export, or the export manifest lists a bot whose file is missing. Nothing else counts."),
      h("p", {}, "Rule differences: documented rules (business rules, requirements, assumptions, process steps) are searched for facts that can be read exactly: durations, retry counts, lists of codes, file names. Each is compared with the same kind of fact in the step or bot whose label shares words with the rule. A link of two or more shared words is strong; one shared word is weak and is listed apart. A documented rule with nothing comparable in the code is ignored."),
      h("p", {}, "Matching a rule to a place in the code is by wording, so check the evidence shown before accepting or acting on a difference."))) ];
}

async function viewSDD() {
  if (!S.sdd) { try { S.sdd = await api("/api/doc?name=" + encodeURIComponent(S.project)); } catch (e) { S.sdd = {html: "", menu: []}; } }
  const d = S.sdd;
  if (!d.html) return [h("div", {class: "empty"}, h("h2", {}, "Nothing to show yet"), h("p", {}, "Load the current code under Code. Documentation, videos, graphs and tables can fill the gaps."))];
  const bar = h("div", {class: "bar"}, h("span", {class: "t"}, d.title), h("span", {class: "s"}, `${d.bots} bots, ${d.documentation.length} documentation file(s), updated ${fmt(d.updated)}`),
    h("button", {class: "primary", onclick: () => { location.href = `/download/${encodeURIComponent(S.project)}/docx`; }}, "Word (.docx)"),
    h("button", {onclick: () => { location.href = `/download/${encodeURIComponent(S.project)}/md`; }}, "Markdown (.md)"),
    h("button", {class: "danger", onclick: async () => { if (!confirm(`Delete project "${S.project}" permanently? A backup copy is kept in the data folder.`)) return; await post("/api/delete", {name: S.project}); S.project = null; boot(); }}, "Delete project"));
  const paper = h("article", {class: "paper"}); paper.innerHTML = d.html;  // server-escaped
  const hist = h("details", {class: "hist"}, h("summary", {}, "Load history"), (S.info.history || []).map(x =>
    h("div", {}, `${fmt(x.at)}  ${x.kind || "code"} (${x.mode}): ${(x.files || []).join(", ")}  (+${n(x.added)} added, ${n(x.updated)} updated, ${n(x.unchanged)} unchanged, ${n(x.removed)} removed)`)));
  return [bar, paper, hist];

// ----------------------------------------------------------- navigation ---
async function loadInfo() {
  S.info = await api("/api/project?name=" + encodeURIComponent(S.project));
  $("dataDir").textContent = S.info.data_dir ? "Stored in " + S.info.data_dir : "";
}

function renderMenu() {
  const menu = $("menu"); menu.replaceChildren();
  $("nav").hidden = !S.project; $("navTitle").textContent = S.project || "Project";
  if (!S.project || !S.info) return;
  const todo = i => (i.gaps ? i.gaps.to_provide + i.gaps.open_rules : 0);
  const i = S.info, counts = {analysis: todo(S.info) ? todo(S.info) + " to decide" : "", code: i.code.bots ? i.code.bots + " bots" : "", docs: i.documentation.length || "", videos: i.videos.length || "", graphs: i.graphs.length || "", tables: i.tables.length || ""};
  for (const v of VIEWS) {
    const li = h("li", {}, h("a", {class: S.view === v.id ? "on" : "", onclick: () => go(v.id)}, h("span", {}, v.label), counts[v.id] ? h("span", {class: "count"}, counts[v.id]) : null));
    if (v.id === "sdd" && S.view === "sdd" && S.sdd && S.sdd.menu && S.sdd.menu.length) {
      const ul = h("ul", {});
      for (const m of S.sdd.menu) {
        const tags = h("span", {class: "tags"});
        if (m.todo) tags.append(h("span", {class: "badge", title: "Placeholders still open in this section"}, m.todo + " to do"));
        if (m.docs) tags.append(h("span", {class: "badge doc", title: "Passages taken from documentation, videos, graphs or tables, not verified against the code"}, m.docs + " from docs"));
        ul.append(h("li", {class: m.level === 1 ? "g" : ""}, h("a", {"data-target": m.id, onclick: () => { const el = $(m.id); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); }}, h("span", {}, m.text), tags)));
      }
      li.append(ul);
    }
    menu.append(li);
  }
}

function spy() {
  const links = [...document.querySelectorAll("#menu ul a")];
  const on = () => {
    let active = null;
    for (const a of links) { const el = $(a.dataset.target); if (el && el.getBoundingClientRect().top < 140) active = a; }
    links.forEach(a => a.classList.toggle("on", a === active));
  };
  $("main").onscroll = on; window.onscroll = on; on();
}

async function show() {
  const view = $("view"); view.replaceChildren();
  if (!S.project) { view.append(h("div", {class: "empty"}, h("h2", {}, "No project selected"), h("p", {}, "Select a project on the left, or create a new one. Then choose SDD, Code, Documentation, Videos, Graphs or Tables."))); renderMenu(); return; }
  let content;
  if (S.view === "sdd") content = await viewSDD();
  else if (S.view === "analysis") content = await viewAnalysis();
  else content = [h("div", {class: "page"}, {code: viewCode, docs: viewDocs, videos: viewVideos, graphs: viewGraphs, tables: viewTables}[S.view]())];
  view.append(...content);
  renderMenu(); if (S.view === "sdd") spy();
  $("main").scrollTop = 0;
}

async function go(viewId) {
  S.view = viewId; store.set("sdd.view", viewId); S.sdd = null;
  await loadInfo(); await show();
}

async function select(name, startAtCode) {
  S.project = name || null; S.sdd = null; S.flash = null;
  if (name) store.set("sdd.doc", name);
  if (!name) { $("dataDir").textContent = ""; await show(); return; }
  await loadInfo();
  if (S.info.fresh || startAtCode) S.view = "code";  // a project with nothing in it starts at Code
  await show();
}

async function boot(want) {
  const docs = await api("/api/docs");
  const sel = $("projSel"); sel.replaceChildren();
  for (const d of docs) sel.append(h("option", {value: d.name}, `${d.name} (${d.bots} bots)`));
  const pick = [want, store.get("sdd.doc")].find(x => x && docs.some(d => d.name === x)) || (docs[0] && docs[0].name);
  if (pick) sel.value = pick;
  await select(pick || null);
  checkRecover();
}

// ------------------------------------------------------------- projects ---
$("projSel").addEventListener("change", async e => { await select(e.target.value); });
$("newBtn").addEventListener("click", () => { $("newRow").hidden = false; $("newName").focus(); });
$("newOk").addEventListener("click", async () => {
  const name = $("newName").value.trim();
  if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,59}$/.test(name)) { alert("Name: 1 to 60 letters, digits, spaces, dot, dash or underscore."); return; }
  if (![...$("projSel").options].some(o => o.value === name)) $("projSel").append(h("option", {value: name}, name + " (new)"));
  $("projSel").value = name; $("newRow").hidden = true; $("newName").value = "";
  await select(name, true);
});

async function recover(folder) {
  const j = await post("/api/recover", {folder});
  return Object.entries(j.imported).map(([a, b]) => a === b ? a : `${a} as ${b}`);
}
async function checkRecover() {
  let found = [];
  try { found = await api("/api/recover"); } catch (e) { return; }
  $("recover").hidden = !found.length;
  const ul = $("recoverList"); ul.replaceChildren();
  for (const f of found) ul.append(h("li", {}, h("span", {}, f.folder, h("small", {}, f.documents.join(", "))),
    h("button", {class: "tiny", onclick: async () => { try { const r = await recover(f.folder); $("rmsg").textContent = r.length ? "Recovered: " + r.join(", ") : "Nothing to import."; await boot(); } catch (e) { $("rmsg").textContent = e.message; } }}, "Import")));
}
$("rbtn").addEventListener("click", async () => {
  const f = $("rpath").value.trim();
  if (!f) { $("rmsg").textContent = "Enter a folder path."; return; }
  try { const r = await recover(f); $("rmsg").textContent = "Recovered: " + r.join(", "); $("rpath").value = ""; await boot(); }
  catch (e) { $("rmsg").textContent = e.message; $("rmsg").className = "msg err"; }
});

S.view = store.get("sdd.view") || "sdd";
if (!VIEWS.some(v => v.id === S.view)) S.view = "sdd";
boot().catch(e => { $("view").textContent = e.message; });
</script>
